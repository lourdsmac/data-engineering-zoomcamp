services:
  pgdatabase:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "ny_taxi"
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"  # Use the PostgreSQL default port
    networks:
      - pgnetwork    # Ensure both services are on the same network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8085:80"    # Maps pgAdmin's web interface
    networks:
      - pgnetwork    # Ensure both services are on the same network

  taxi_ingest:
    image: taxi_ingest:v001
    networks:
      - pgnetwork
    command: >
      --pg-user root
      --pg-password root
      --pg-host pgdatabase
      --pg-port 5432
      --pg-db ny_taxi
      --year 2021
      --month 1
      --table yellow_taxi_data
      --chunksize 100000
    depends_on:
      - pgdatabase
    restart: "no"

networks:
  pgnetwork:       # Ensure the network is defined here

volumes:
  ny_taxi_postgres_data:  # Volume for PostgreSQL data
  pgadmin_data:            # Volume for pgAdmin configuration
